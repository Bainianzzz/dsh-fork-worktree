# Host row of the bundle.
#
# The name addresses ./host.js by absolute path instead of the package entry:
# re-enabling the row in a live profile then imports a module URL Node has never
# cached, so the new revision actually runs. (A package specifier would resolve
# through the package.json the running process already read when this bundle was
# first installed.) The bundle itself is installed as a `link:` to this
# directory, so this path is already part of the profile's own state.
- insert:
    - id: fork-worktree
      name: '/Users/bainian/code/dsh/dsh-fork-worktree/plugin/entry.js'
